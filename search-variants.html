<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Поиск — варианты</title>
<link rel="stylesheet" href="app.css?v=variants">
<style>
/* A temporary page: four takes on the quick game's search, each live, to pick one. */
html, body { overflow: auto; height: auto; }
.vs-page { padding: calc(env(safe-area-inset-top) + 16px) 16px 40px; display: grid; gap: 18px; }
.vs-page h1 { font-size: 22px; margin: 0; }
.vs-card { position: relative; height: 470px; border-radius: 22px; overflow: hidden; border: 1px solid #20344A;
  background: radial-gradient(420px at 50% 0, #12243A, #07111D); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.vs-tag { position: absolute; left: 14px; top: 12px; font-size: 13px; font-weight: 800; letter-spacing: .08em; color: #FFE7A3; }
.vs-copy { text-align: center; } .vs-copy b { display: block; font-size: 20px; } .vs-copy small { color: var(--muted); font-size: 13px; }
.me { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: #0B1626; font-weight: 800; font-size: 24px; color: #fff; box-shadow: 0 0 0 3px #FF5364, 0 0 30px rgba(255, 83, 100, .5); }
.face { border-radius: 50%; overflow: hidden; } .face img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* B — roulette: faces race past a frame like a slot reel and slow down. */
.reel-row { display: flex; align-items: center; gap: 18px; }
.reel { position: relative; width: 84px; height: 84px; border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 3px #32E5A1, 0 0 30px rgba(50, 229, 161, .45); background: #0B1626; }
.reel-strip { display: flex; flex-direction: column; animation: reel 1.6s cubic-bezier(.5, 0, .5, 1) infinite; }
.reel-strip img { width: 84px; height: 84px; object-fit: cover; filter: blur(1.5px) saturate(.8); }
@keyframes reel { to { transform: translateY(-504px); } }
.reel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(#0B1626cc, transparent 30%, transparent 70%, #0B1626cc); }
.reel-vs { font-style: italic; font-weight: 900; font-size: 28px; color: #FFD978; text-shadow: 0 0 16px rgba(255, 200, 100, .5); }

/* C — duel line: you on the left, a pulsing «?» on the right, sparks run along the line between. */
.vduel { position: relative; width: 300px; height: 120px; display: flex; align-items: center; justify-content: space-between; }
.vduel .q { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; font-weight: 900; color: #32E5A1;
  background: #0B1626; box-shadow: 0 0 0 3px rgba(50, 229, 161, .5); animation: qpulse 1.4s ease-in-out infinite; }
@keyframes qpulse { 50% { box-shadow: 0 0 0 3px #32E5A1, 0 0 34px rgba(50, 229, 161, .7); transform: scale(1.06); } }
.vduel-line { position: absolute; left: 86px; right: 86px; top: 50%; height: 2px; background: linear-gradient(90deg, rgba(255, 83, 100, .4), rgba(50, 229, 161, .4)); }
.vduel-line i { position: absolute; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px #fff; animation: spark 1.2s linear infinite; }
.vduel-line i:nth-child(2) { animation-delay: .4s; } .vduel-line i:nth-child(3) { animation-delay: .8s; }
@keyframes spark { from { left: 0; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { left: 100%; opacity: 0; } }
.vduel-ball { position: absolute; left: 50%; top: 14px; width: 26px; height: 26px; margin-left: -13px; animation: bounce .7s cubic-bezier(.3, 0, .7, 1) infinite alternate; }
@keyframes bounce { to { transform: translateY(26px) rotate(160deg); } }

/* D — orbit: faces circle you on two rings turning opposite ways. */
.orbit { position: relative; width: 280px; height: 280px; display: grid; place-items: center; }
.ring { position: absolute; border-radius: 50%; border: 1px dashed rgba(255, 255, 255, .14); }
.ring.a { inset: 30px; animation: spin 14s linear infinite; } .ring.b { inset: 0; animation: spin 22s linear infinite reverse; }
.ring .face { position: absolute; width: 38px; height: 38px; margin: -19px; box-shadow: 0 0 0 2px rgba(255, 255, 255, .3); }
.ring.a .face { animation: spin 14s linear infinite reverse; } .ring.b .face { animation: spin 22s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.orbit .me { position: relative; z-index: 1; animation: breathe2 2s ease-in-out infinite; }
@keyframes breathe2 { 50% { box-shadow: 0 0 0 3px #FF5364, 0 0 50px rgba(255, 83, 100, .75); } }
</style></head>
<body><div class="vs-page">
  <h1>Поиск соперника — варианты</h1>

  <div class="vs-card"><span class="vs-tag">A · РАДАР (сейчас)</span>
    <div class="radar"><span class="rd-grid"></span><span class="rd-wave"></span><span class="rd-wave w2"></span><span class="rd-wave w3"></span><span class="rd-sweep"></span>
      <span class="rd-blip" style="--a:28deg;--r:.78;--d:.22s"><img src="img/p_messi.jpg"></span><span class="rd-blip" style="--a:96deg;--r:.58;--d:.75s"><img src="img/p_cr7.jpg"></span>
      <span class="rd-blip" style="--a:150deg;--r:.86;--d:1.17s"><img src="img/p_mbappe.jpg"></span><span class="rd-blip" style="--a:212deg;--r:.62;--d:1.65s"><img src="img/p_modric.jpg"></span>
      <span class="rd-blip" style="--a:262deg;--r:.84;--d:2.04s"><img src="img/p_henry.jpg"></span><span class="rd-blip" style="--a:322deg;--r:.6;--d:2.5s"><img src="img/p_iniesta.jpg"></span>
      <span class="rd-me"><b>ТЫ</b></span></div>
    <div class="vs-copy"><b>Ищем соперника</b><small>Любитель · 0:07</small></div></div>

  <div class="vs-card"><span class="vs-tag">B · РУЛЕТКА</span>
    <div class="reel-row"><span class="me">ТЫ</span><span class="reel-vs">VS</span>
      <span class="reel"><span class="reel-strip"><img src="img/p_messi.jpg"><img src="img/p_cr7.jpg"><img src="img/p_mbappe.jpg"><img src="img/p_modric.jpg"><img src="img/p_henry.jpg"><img src="img/p_iniesta.jpg"><img src="img/p_messi.jpg"></span></span></div>
    <div class="vs-copy"><b>Ищем соперника</b><small>Любитель · 0:07</small></div></div>

  <div class="vs-card"><span class="vs-tag">C · ДУЭЛЬ</span>
    <div class="vduel"><span class="me">ТЫ</span><img class="vduel-ball" src="img/ball.png" alt=""><span class="vduel-line"><i></i><i></i><i></i></span><span class="q">?</span></div>
    <div class="vs-copy"><b>Ищем соперника</b><small>Любитель · 0:07</small></div></div>

  <div class="vs-card"><span class="vs-tag">D · ОРБИТА</span>
    <div class="orbit">
      <span class="ring b"><span class="face" style="left:50%;top:0"><img src="img/p_messi.jpg"></span><span class="face" style="left:100%;top:50%"><img src="img/p_cr7.jpg"></span><span class="face" style="left:50%;top:100%"><img src="img/p_mbappe.jpg"></span><span class="face" style="left:0;top:50%"><img src="img/p_modric.jpg"></span></span>
      <span class="ring a"><span class="face" style="left:85%;top:15%"><img src="img/p_henry.jpg"></span><span class="face" style="left:15%;top:85%"><img src="img/p_iniesta.jpg"></span><span class="face" style="left:15%;top:15%"><img src="img/p_benzema.jpg"></span></span>
      <span class="me">ТЫ</span></div>
    <div class="vs-copy"><b>Ищем соперника</b><small>Любитель · 0:07</small></div></div>
</div></body></html>
